<div class="main w-100 d-flex justify-content-center">

  <div class="main__container">

    <div class="main-nav__logo"></div>

    <div class="text">
      <div class="services">Бизнес-тренинги Корпоративное обучение Открытые мероприятия</div>
      <div class="button-trainings">
        <button 
          routerLink="/trainings" 
          appGtmClick 
          gtmEventName="cta_click"
          [gtmEventData]="{button_name: 'Каталог тренингов', category: 'main_cta', location: 'hero_section'}">
          КАТАЛОГ ТРЕНИНГОВ
        </button>
      </div>
      <div class="motto">Основано на практике. Нацелено на результат.</div>
    </div>

  </div>


  <div class="main-nav">
    <div class="main-nav__menu d-none d-md-flex">
      <div class="buttons">
        <button *ngFor="let link of menu | slice:1"
                [routerLink]="link.url"
                appGtmClick
                gtmEventName="navigation_click"
                [gtmEventData]="{button_name: link.name, category: 'main_navigation', location: 'top_menu'}">
          {{link.name}}
        </button>
      </div>
    </div>


  </div>
</div>
